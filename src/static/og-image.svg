<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background charcoal gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2228"/>
      <stop offset="50%" stop-color="#17191C"/>
      <stop offset="100%" stop-color="#0F1113"/>
    </linearGradient>

    <!-- Radial atmospheric glows -->
    <radialGradient id="ogLimeGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#B7F34A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#B7F34A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogRedGlow" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>

    <!-- Lime gradient -->
    <linearGradient id="ogLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF70"/>
      <stop offset="100%" stop-color="#B7F34A"/>
    </linearGradient>

    <!-- Red gradient -->
    <linearGradient id="ogRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8E8E"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogLimeGlow)"/>
  <rect width="1200" height="630" fill="url(#ogRedGlow)"/>

  <!-- Subtle gaming grid texture -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Logo Mark + Wordmark at top left -->
  <g transform="translate(100, 90)">
    <!-- Symbol -->
    <g transform="scale(0.8)">
      <circle cx="50" cy="50" r="42" fill="#1C2026" stroke="#2F3642" stroke-width="2.5"/>
      <ellipse cx="50" cy="50" rx="38" ry="14" stroke="#363E4D" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
      <rect x="36" y="27" width="12" height="34" rx="3.5" fill="url(#ogLime)"/>
      <rect x="25" y="38" width="34" height="12" rx="3.5" fill="url(#ogLime)"/>
      <circle cx="42" cy="44" r="3" fill="#17191C"/>
      <circle cx="65" cy="52" r="5.5" fill="url(#ogRed)"/>
      <circle cx="73" cy="41" r="5.5" fill="url(#ogRed)"/>
      <path d="M 8 54 C 18 76, 78 78, 94 56" stroke="url(#ogLime)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>
    <!-- Brand Title -->
    <text x="100" y="55" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="44" font-weight="700" fill="#F4F5F7">Arcade<tspan fill="url(#ogLime)">World</tspan></text>
  </g>

  <!-- Hero Headline -->
  <text x="100" y="280" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="68" font-weight="700" fill="#F4F5F7" letter-spacing="-0.03em">Discover the Best</text>
  <text x="100" y="360" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="68" font-weight="700" fill="url(#ogLime)" letter-spacing="-0.03em">Independent Web Games</text>

  <!-- Subtitle -->
  <text x="100" y="430" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="400" fill="#A4ACB9">Curated browser games, game-jam surprises and AI experiments. Play at the source.</text>

  <!-- Feature Tags / Badges -->
  <g transform="translate(100, 480)">
    <!-- Badge 1: 2,000+ Games -->
    <rect x="0" y="0" width="170" height="42" rx="21" fill="#20242B" stroke="#323842" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="5" fill="#B7F34A"/>
    <text x="36" y="27" font-family="'Space Mono', monospace" font-size="15" font-weight="700" fill="#F4F5F7">2,000+ Games</text>

    <!-- Badge 2: Outbound Discovery -->
    <rect x="185" y="0" width="200" height="42" rx="21" fill="#20242B" stroke="#323842" stroke-width="1.5"/>
    <circle cx="207" cy="21" r="5" fill="#FF6B6B"/>
    <text x="221" y="27" font-family="'Space Mono', monospace" font-size="15" font-weight="700" fill="#F4F5F7">Original Creators</text>

    <!-- Badge 3: 100% Free to Play -->
    <rect x="400" y="0" width="170" height="42" rx="21" fill="#20242B" stroke="#323842" stroke-width="1.5"/>
    <circle cx="422" cy="21" r="5" fill="#B7F34A"/>
    <text x="436" y="27" font-family="'Space Mono', monospace" font-size="15" font-weight="700" fill="#F4F5F7">Free to Play</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="100" y="560" width="160" height="5" rx="2.5" fill="url(#ogLime)"/>
  <rect x="270" y="560" width="40" height="5" rx="2.5" fill="url(#ogRed)"/>
</svg>