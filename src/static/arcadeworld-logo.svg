<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none" width="340" height="70">
  <defs>
    <radialGradient id="logoSphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#242930"/>
      <stop offset="70%" stop-color="#17191C"/>
      <stop offset="100%" stop-color="#0E1012"/>
    </radialGradient>
    <linearGradient id="logoLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF70"/>
      <stop offset="100%" stop-color="#B7F34A"/>
    </linearGradient>
    <linearGradient id="logoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8E8E"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
  </defs>

  <!-- Embedded Icon Mark (scaled to 54x54 at x=8, y=8) -->
  <g transform="translate(8, 8) scale(0.54)">
    <!-- Base Planet -->
    <circle cx="50" cy="50" r="42" fill="url(#logoSphere)" stroke="#2F3642" stroke-width="2.5"/>

    <!-- Grid Lines -->
    <path d="M 12 50 A 38 14 0 0 0 88 50 A 38 14 0 0 0 12 50 Z" stroke="#363E4D" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <ellipse cx="50" cy="50" rx="18" ry="42" stroke="#363E4D" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

    <!-- D-Pad Motif -->
    <rect x="36" y="27" width="12" height="34" rx="3.5" fill="url(#logoLime)"/>
    <rect x="25" y="38" width="34" height="12" rx="3.5" fill="url(#logoLime)"/>
    <circle cx="42" cy="44" r="3" fill="#17191C"/>

    <!-- Action Buttons -->
    <circle cx="65" cy="52" r="5.5" fill="url(#logoRed)"/>
    <circle cx="73" cy="41" r="5.5" fill="url(#logoRed)"/>

    <!-- Front Ring Arc -->
    <path d="M 8 54 C 18 76, 78 78, 94 56" stroke="url(#logoLime)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="86" cy="62" r="3" fill="#B7F34A"/>
  </g>

  <!-- Typography / Wordmark -->
  <g transform="translate(72, 45)">
    <!-- "Arcade" in clean crisp white -->
    <text font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="30" font-weight="700" fill="#F4F5F7" letter-spacing="-0.03em">Arcade</text>
    <!-- "World" in vibrant brand lime green -->
    <text x="110" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="30" font-weight="800" fill="url(#logoLime)" letter-spacing="-0.03em">World</text>
    <!-- Accent indicator dot in light red -->
    <circle cx="202" cy="-21" r="3.5" fill="url(#logoRed)"/>
  </g>
</svg>